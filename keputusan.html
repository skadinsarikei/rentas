<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Keputusan Merentas Desa MSSD Sarikei 2026</title>
<style>
*{box-sizing:border-box}body{font:15px/1.4 system-ui,sans-serif;margin:0;background:#f6f8fa;color:#1f2328}
main{max-width:900px;margin:0 auto;padding:12px}.card{background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:14px;margin-bottom:12px}
input,select,button{font:inherit;padding:7px 9px;border:1px solid #d0d7de;border-radius:6px}button{background:#0b5cab;color:#fff;border:0;cursor:pointer}button.s{background:#57606a}button:disabled{opacity:.5}
.r{display:grid;grid-template-columns:50px 150px 1fr;gap:8px;align-items:center;margin-bottom:6px}.err{color:#cf222e}.ok{color:#1a7f37}.w{color:#9a6700}
table{border-collapse:collapse;width:100%}td,th{border:1px solid #d0d7de;padding:4px 7px;font-size:13px;text-align:left}
body.tv{background:#0d1117;color:#e6edf3;font-size:max(14px,1.7vh)}body.tv main{max-width:none}.tv h1{margin:0 0 4px;font-size:1.5em}
.tv .l{display:grid;grid-template-columns:3fr 1.2fr;gap:16px}.tv .t{column-count:2;column-gap:20px}.tv .t div{display:grid;grid-template-columns:2.2em 1fr 3em 11em;gap:6px;padding:1px 0;line-height:1.25;border-bottom:1px solid #30363d;break-inside:avoid}
.tv .t div:nth-child(-n+3){color:#f2cc60;font-weight:700}.tv i{font-style:normal}.tv small{color:#8b949e}.tv .i div{padding:2px 0;border-bottom:1px solid #30363d}
</style></head><body><main>
<div id="vTv" hidden><h1 id="tvT"></h1><small id="tvS"></small><div class="l"><div class="t" id="tvB"></div><div class="i"><b>10 TERBAIK (INDIVIDU)</b><div id="tvI"></div></div></div><small id="tvF"></small></div>
<div id="vLogin" class="card"><h3>Pencatat Markah – Merentas Desa MSSD Sarikei 2026</h3><p><input id="nm" placeholder="Nama pencatat"> <input id="pw" type="password" placeholder="Kata laluan"> <button onclick="masuk()">Masuk</button></p><div id="mL" class="err"></div></div>
<div id="vC" hidden><div class="card"><b>Kategori:</b> <select id="kat" onchange="baris()"><option value="L">Lelaki 11 TKB</option><option value="P">Perempuan 11 TKB</option></select> &nbsp;<b>Mula kedudukan:</b> <input id="mula" type="number" value="1" min="1" style="width:80px" onchange="baris()">
<p style="color:#57606a;font-size:13px">Taip No. Peserta (contoh ADIN 33) mengikut borang. Nama dan sekolah dipaparkan untuk disemak.</p><div id="rows"></div><button id="hb" onclick="hantar()">Hantar 10 kedudukan</button> <span id="mC"></span></div>
<div class="card" id="adm" hidden><b>Admin</b> – <a href="#tv=L" target="_blank">Paparan TV Lelaki</a> · <a href="#tv=P" target="_blank">Paparan TV Perempuan</a>
<p><button class="s" onclick="entri()">Muat entri kategori ini</button></p><div id="ent"></div></div></div></main>
<script>
const API='https://script.google.com/macros/s/AKfycbziD-XVjuO1EokjyLKQZHhQo5r87iAqcnGR4e0pUkPUqbgcVWBmN-I2Pd47wImWv42Z/exec',$=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nk=s=>String(s||'').replace(/\s+/g,'').toUpperCase();let D={},PW='',NM='';
async function call(o){try{return await(await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)})).json()}catch(e){return{ok:false,msg:'Tidak dapat berhubung dengan pelayan.'}}}
async function masuk(){PW=$('pw').value;NM=$('nm').value.trim()||'pencatat';$('mL').textContent='Memeriksa…';const r=await call({a:'mula',pw:PW});if(!r.ok)return $('mL').textContent=r.msg;
D=r;D.m={};r.peserta.forEach(p=>D.m[nk(p.no)]=p);$('vLogin').hidden=true;$('vC').hidden=false;$('adm').hidden=r.role!='admin';baris()}
function baris(){const s=+$('mula').value||1;let h='';for(let i=0;i<10;i++)h+=`<div class="r" data-p="${s+i}"><b>${s+i}</b><input placeholder="No. Peserta" oninput="eko(this)"><span></span></div>`;$('rows').innerHTML=h;$('mC').textContent=''}
function eko(el){const p=D.m[nk(el.value)],sp=el.nextElementSibling,k=$('kat').value;
if(!el.value.trim())sp.textContent='';else if(!p){sp.className='err';sp.textContent='Tidak dijumpai'}else if(p.kat!=k){sp.className='err';sp.textContent='Kategori '+(p.kat=='L'?'lelaki':'perempuan')+': '+p.nama}else{sp.className='ok';sp.textContent=p.nama+' · '+p.sek}}
async function hantar(){const items=[...document.querySelectorAll('#rows .r')].map(r=>({pos:r.dataset.p,no:r.children[1].value})).filter(x=>x.no.trim());if(!items.length)return;
$('hb').disabled=true;$('mC').textContent='Menyimpan…';const r=await call({a:'catat',pw:PW,nama:NM,kat:$('kat').value,items});$('hb').disabled=false;
if(!r.ok){$('mC').className='err';return $('mC').textContent=r.msg}
const bad={};r.ralat.forEach(e=>bad[e.pos]=e.msg);
document.querySelectorAll('#rows .r').forEach(row=>{const p=row.dataset.p;if(bad[p]){row.children[2].className='err';row.children[2].textContent=bad[p]}else if(r.disimpan.includes(+p)){row.children[1].value='';row.children[1].disabled=true;row.children[2].className='ok';row.children[2].textContent+=' ✔'}});
$('mC').className=r.ralat.length?'w':'ok';$('mC').textContent=r.disimpan.length+' disimpan'+(r.ralat.length?', '+r.ralat.length+' perlu dibetulkan (kecuali kedudukan itu, baris lain sudah disimpan).':'. Taip kelompok seterusnya.');
if(!r.ralat.length){$('mula').value=(+$('mula').value)+10;setTimeout(baris,600)}}
async function entri(){const k=$('kat').value,r=await call({a:'entri',pw:PW,kat:k});if(!r.ok)return $('ent').textContent=r.msg;
$('ent').innerHTML='<table><tr><th>Kad</th><th>No. Peserta</th><th>Nama</th><th>Status</th><th></th></tr>'+r.list.map(x=>`<tr><td>${x.pos}</td><td>${E(x.no)}</td><td>${E((D.m[nk(x.no)]||{}).nama)}</td><td>${E(x.status)} ${E(x.sebab)}</td><td><button class="s" onclick="tanda(${x.pos},'TIDAK SAH')">Tidak sah</button> <button class="s" onclick="tanda(${x.pos},'SAH')">Sah</button> <button class="s" onclick="tanda(${x.pos},'BATAL')">Batal</button></td></tr>`).join('')+'</table>'}
async function tanda(pos,status){const sebab=status=='SAH'?'':prompt('Sebab:')||'';const r=await call({a:'tanda',pw:PW,kat:$('kat').value,pos,status,sebab});if(!r.ok)alert(r.msg);else entri()}
// ===== Paparan TV: buka dengan #tv=L atau #tv=P =====
const PN={'SK METHODIST ANGLOCHINESE':'SK METHODIST AC'},pn=s=>PN[s]||s; // nama pendek untuk paparan TV sahaja
const tv=(location.hash.match(/tv=([LP])/)||[])[1];
if(tv){document.body.className='tv';$('vLogin').hidden=true;$('vTv').hidden=false;
const muat=async()=>{const r=await call({a:'papan',kat:tv});if(!r.ok)return;
$('tvT').textContent='KEDUDUKAN PASUKAN – '+(tv=='L'?'LELAKI':'PEREMPUAN')+' 11 TKB';
$('tvS').textContent='Kedudukan direkod: '+r.rekod+'/'+r.had+' · 4 kedudukan terbaik dikira · Dikemas kini '+new Date().toLocaleTimeString('ms-MY');
const rw=Math.ceil(r.layak.length/2)||1;document.body.style.fontSize=Math.max(1.2,Math.min(2.4,76/(rw*1.3)))+'vh';let ps=false;
$('tvB').innerHTML=r.layak.map(t=>{const pt=r.layak.some(x=>x!==t&&x.ag===t.ag&&x.k!==t.k);ps=ps||pt;
const s=t.v.slice().sort((a,b)=>a-b).map((x,i)=>`<i style="${i>3?'opacity:.4':'color:#fff'}">${x>=r.pen?'–':x}</i>`).join(' ');
return `<div><b>${t.k}${t.seri?'=':''}</b><span>${E(pn(t.nama))}</span><b>${t.ag}${pt?'*':''}</b><span>${s}</span></div>`}).join('');
window.ps=ps;
$('tvI').innerHTML=r.ind.map(i=>`<div>${i.k}. ${E(i.nama)}<br><small>${E(pn(i.sek))}</small></div>`).join('');
$('tvF').textContent=(window.ps?'* Agregat sama, diputuskan oleh penentu seri. ':'')+(r.tidak.length?'Tidak dikira berpasukan (kurang 4 peserta): '+r.tidak.map(pn).join(', '):'')};
muat();setInterval(muat,6000)}
</script></body></html>
