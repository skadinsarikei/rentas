<!DOCTYPE html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pendaftaran Merentas Desa MSSD Sarikei 2026</title>
<style>
*{box-sizing:border-box}body{font:15px/1.4 system-ui,sans-serif;margin:0;background:#f6f8fa;color:#1f2328}
header{background:#0b5cab;color:#fff;padding:12px 16px}header h1{margin:0;font-size:17px}
main{max-width:980px;margin:16px auto;padding:0 12px}.card{background:#fff;border:1px solid #d0d7de;border-radius:8px;padding:14px;margin-bottom:14px}
input,button{font:inherit;padding:7px 9px;border:1px solid #d0d7de;border-radius:6px;width:100%}input[type=checkbox]{width:auto}
button{width:auto;background:#0b5cab;color:#fff;border:0;cursor:pointer}button.s{background:#57606a}button:disabled{opacity:.5}
label{display:block;font-size:13px;color:#57606a}.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.r{display:grid;grid-template-columns:30px 1.4fr 1.1fr 1.2fr 110px;gap:6px;margin-bottom:6px;align-items:center}.no{font-weight:600;font-size:13px}
.b{display:inline-block;padding:2px 8px;border-radius:10px;background:#ddf4ff;font-size:12px}.b.x{background:#ffebe9}.b.o{background:#dafbe1}
.err{color:#cf222e}.warn{color:#9a6700}.ok{color:#1a7f37}table{border-collapse:collapse;width:100%}td,th{border:1px solid #d0d7de;padding:5px 7px;font-size:13px;text-align:left}
#cetak{display:none}@media(max-width:700px){.g{grid-template-columns:1fr 1fr}.r{grid-template-columns:28px 1fr}.r>*:nth-child(n+3){grid-column:2}}
@media print{header,main{display:none}#cetak{display:block;font:12px Arial}#cetak table{margin:8px 0}#cetak td,#cetak th{border:1px solid #000;padding:5px}}
</style></head><body>
<header><h1>Pendaftaran Kejohanan Merentas Desa Pembangunan (11 TKB) – MSSD Sarikei 2026</h1></header>
<main>
<div id="vLogin" class="card"><h3>Log masuk sekolah</h3><label>Kod sekolah (contoh: YBA1234)<input id="kod" autocomplete="off"></label><p><button onclick="masuk()">Masuk</button></p><div id="mLogin"></div>
<details><summary>Admin</summary><p><label>Kata laluan admin<input id="pw" type="password"></label></p><button class="s" onclick="masukAdmin()">Masuk Admin</button></details></div>
<div id="vForm" hidden><div class="card"><button class="s" onclick="balik()">← Kembali</button> <b id="tajuk"></b> <span id="status"></span></div>
<div class="card"><h3>Maklumat pasukan</h3><div class="g" id="pf"></div></div>
<div class="card"><h3>Senarai peserta</h3><p style="font-size:13px;color:#57606a">Isi No. KP (12 digit) atau No. Sijil Lahir. Nombor peserta dijana automatik.</p><div id="baris"></div><p id="kira"></p>
<button id="simpan" onclick="simpan()">Simpan</button> <button class="s" onclick="cetak()">Cetak borang</button><div id="mForm"></div></div></div>
<div id="vAdmin" hidden><div class="card"><button class="s" onclick="v('vLogin')">← Keluar</button> <b>Dashboard Admin</b><p id="ringkas"></p>
<div style="overflow-x:auto"><table><tr><th>#</th><th>Kod</th><th>Sekolah</th><th>Singkatan</th><th>L</th><th>P</th><th>Daftar</th><th>Disahkan</th><th>Kunci</th><th></th></tr><tbody id="jadual"></tbody></table></div></div></div>
</main><div id="cetak"></div>
<script>
const API='https://script.google.com/macros/s/AKfycbziD-XVjuO1EokjyLKQZHhQo5r87iAqcnGR4e0pUkPUqbgcVWBmN-I2Pd47wImWv42Z/exec';
const PF=[['pengurus','Pengurus Pasukan'],['hp_pengurus','No. HP'],['ketua','Ketua Jurulatih'],['hp_ketua','No. HP'],['jurulatih','Jurulatih'],['hp_jurulatih','No. HP'],['juruiring','Juruiring'],['hp_juruiring','No. HP']];
const $=id=>document.getElementById(id),E=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={},PW='';$('pf').innerHTML=PF.map(([k,l])=>`<label>${l}<input id="p_${k}"></label>`).join('');
async function call(o){try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(o)});return await r.json()}catch(e){return{ok:false,msg:'Tidak dapat berhubung dengan pelayan.'}}}
function v(id){['vLogin','vForm','vAdmin'].forEach(x=>$(x).hidden=x!=id)}
function note(id,h,c){$(id).innerHTML=h;$(id).className=c||''}
async function masuk(){const k=$('kod').value.trim().toUpperCase();if(!k)return note('mLogin','Sila isi kod sekolah.','err');note('mLogin','Memeriksa…');await buka(k,'','mLogin')}
async function buka(kod,pw,m){const r=await call({a:'login',kod,pw});if(!r.ok)return note(m||'mLogin',E(r.msg),'err');S=r;paparBorang();v('vForm')}
async function masukAdmin(){PW=$('pw').value;await adminLoad()}
async function adminLoad(){const r=await call({a:'adminList',pw:PW});if(!r.ok)return note('mLogin',E(r.msg),'err');paparAdmin(r.list)}
function balik(){S.admin?adminLoad():v('vLogin')}
function paparBorang(){const s=S.sekolah,t=S.pasukan||{},ro=S.tutup&&!S.admin;
$('tajuk').textContent=s.nama+' ('+s.kod+')';
$('status').innerHTML=(S.admin?'<span class="b">Mod admin</span> ':'')+(S.tutup?`<span class="b x">${ro?'Pendaftaran ditutup – baca sahaja':'Ditutup (admin boleh sunting)'}</span>`:'<span class="b o">Pendaftaran dibuka</span>');
PF.forEach(([k])=>$('p_'+k).value=t[k]||'');let h='';
[['L','LELAKI 11 TKB',33],['P','PEREMPUAN 11 TKB',41]].forEach(([k,l,n])=>{h+=`<h4>${l}</h4>`;for(let i=1;i<=5;i++)h+=`<div class="r" data-k="${k}" data-i="${i}"><b>${(k=='L'?0:5)+i}</b><input placeholder="Nama peserta"><input placeholder="No. KP / Sijil Lahir"><input placeholder="Catatan"><span class="no">${E(s.singkatan)} ${n+i-1}</span></div>`});
$('baris').innerHTML=h;
S.peserta.forEach(p=>{const r=document.querySelector(`.r[data-k="${p.kategori}"][data-i="${p.slot}"]`);if(r){r.children[1].value=p.nama;r.children[2].value=p.dokumen;r.children[3].value=p.catatan||''}});
document.querySelectorAll('#vForm input').forEach(e=>e.disabled=ro);$('simpan').disabled=ro;kira();$('mForm').innerHTML=''}
function kira(){const c={L:0,P:0};document.querySelectorAll('.r[data-k]').forEach(r=>{if(r.children[1].value.trim())c[r.dataset.k]++});
const w=k=>c[k]>0&&c[k]<4?' <span class="warn">(kurang 4: tidak dikira berpasukan)</span>':'';
$('kira').innerHTML=`Lelaki: <b>${c.L}</b>${w('L')} · Perempuan: <b>${c.P}</b>${w('P')} · Jumlah: <b>${c.L+c.P}</b>`}
document.addEventListener('input',kira);
const rowsData=()=>[...document.querySelectorAll('.r[data-k]')].map(r=>({kategori:r.dataset.k,slot:+r.dataset.i,nama:r.children[1].value,dokumen:r.children[2].value,catatan:r.children[3].value}));
const team=()=>{const o={};PF.forEach(([k])=>o[k]=$('p_'+k).value);return o};
async function simpan(){const b=$('simpan');b.disabled=true;note('mForm','Menyimpan…');
const r=await call({a:'save',kod:S.sekolah.kod,pw:S.admin?PW:'',pasukan:team(),peserta:rowsData()});b.disabled=false;
if(!r.ok)return note('mForm',r.errors?'<b>Sila betulkan:</b><ul>'+r.errors.map(e=>`<li>${E(e)}</li>`).join('')+'</ul>':E(r.msg),'err');
note('mForm',`<b>Berjaya disimpan (${r.jumlah} peserta).</b>`+(r.warnings.length?'<ul class="warn">'+r.warnings.map(e=>`<li>${E(e)}</li>`).join('')+'</ul>':''),'ok')}
function cetak(){const s=S.sekolah,t=team(),R=rowsData(),n=k=>R.filter(x=>x.kategori==k&&x.nama.trim()).length;
const tr=x=>`<tr><td>${(x.kategori=='L'?0:5)+x.slot}</td><td>${E(x.nama.toUpperCase())}</td><td>${E(x.dokumen)}</td><td>${E(s.singkatan)} ${(x.kategori=='L'?33:41)+x.slot-1}</td><td>${E(x.catatan)}</td></tr>`;
const sec=(k,l)=>`<tr><th colspan="5">${l}</th></tr>`+R.filter(x=>x.kategori==k).map(tr).join('');
const j=(l,a,b)=>`<tr><td>${l}</td><td>${E(a)}</td><td>No. HP:</td><td>${E(b)}</td></tr>`;
$('cetak').innerHTML=`<div style="text-align:center"><b>BORANG PENYERTAAN SEKOLAH RENDAH<br>KEJOHANAN MERENTAS DESA PEMBANGUNAN<br>MAJLIS SUKAN SEKOLAH DAERAH SARIKEI<br>2026</b></div><table><tr><td>NAMA SEKOLAH</td><td colspan="3">${E(s.nama)} (${E(s.kod)})</td></tr>${j('PENGURUS PASUKAN',t.pengurus,t.hp_pengurus)}${j('KETUA JURULATIH',t.ketua,t.hp_ketua)}${j('JURULATIH',t.jurulatih,t.hp_jurulatih)}${j('JURUIRING',t.juruiring,t.hp_juruiring)}<tr><td>BILANGAN ATLET</td><td>Lelaki: ${n('L')}</td><td>Perempuan: ${n('P')}</td><td>Jumlah: ${n('L')+n('P')}</td></tr></table><table><tr><th>BIL.</th><th>NAMA PESERTA</th><th>NO. KAD PENGENALAN / SIJIL LAHIR</th><th>NO. PESERTA</th><th>CATATAN</th></tr>${sec('L','LELAKI 11TKB')}${sec('P','PEREMPUAN 11TKB')}</table><p>Disahkan oleh:<br><br>………………………………… <span style="float:right">Cop sekolah:</span></p>`;window.print()}
function paparAdmin(l){v('vAdmin');const sum=k=>l.reduce((a,x)=>a+x[k],0);
$('ringkas').innerHTML=`Sekolah mendaftar: <b>${l.filter(x=>x.L+x.P>0).length}/${l.length}</b> · Lelaki: <b>${sum('L')}</b> · Perempuan: <b>${sum('P')}</b>`;
$('jadual').innerHTML=l.map((x,i)=>`<tr><td>${i+1}</td><td>${E(x.kod)}</td><td>${E(x.nama)}${x.dup?' <span class="b x">singkatan sama</span>':''}</td><td>${E(x.singkatan)}</td><td>${x.L}</td><td>${x.P}</td><td>${x.L+x.P?'✔':'—'}</td><td><input type="checkbox" ${x.disahkan?'checked':''} onchange="flag('${x.kod}','disahkan',this.checked)"></td><td><input type="checkbox" ${x.kunci?'checked':''} onchange="flag('${x.kod}','kunci',this.checked)"></td><td><button class="s" onclick="buka('${x.kod}',PW)">Buka</button></td></tr>`).join('')}
async function flag(kod,field,value){const r=await call({a:'adminFlag',pw:PW,kod,field,value});if(!r.ok)alert(r.msg||'Gagal menyimpan')}
</script></body></html>
